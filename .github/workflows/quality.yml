name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kitchen_keeps_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kitchen_keeps_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kitchen_keeps_test
      SESSION_SECRET: test-session-secret-that-is-long-enough
      PORT: 8081
      SERVER_URL: http://127.0.0.1:8081
      CLIENT_URL: http://127.0.0.1:4173
      CORS_ORIGIN: http://127.0.0.1:4173
      TRUST_PROXY: 0
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck --workspace client
      - run: npm run test:server
      - run: npm run db:test:verify
      - run: npm run test:integration
      - run: VITE_API_BASE_URL=http://127.0.0.1:8081 npm run build:client
      - run: npx playwright install --with-deps chromium
      - name: Start API and client preview
        run: |
          npm run start:server > /tmp/kitchen-keeps-api.log 2>&1 &
          VITE_API_BASE_URL=http://127.0.0.1:8081 npm run preview --workspace client -- --host 127.0.0.1 > /tmp/kitchen-keeps-client.log 2>&1 &
          for attempt in {1..30}; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/auth/me)" = "401" ] && \
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/login)" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kitchen-keeps-api.log
          cat /tmp/kitchen-keeps-client.log
          exit 1
      - run: npm run test:e2e
      - if: failure()
        name: Upload service logs
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: /tmp/kitchen-keeps-*.log
          if-no-files-found: ignore
